server {
    listen 80;
    server_name localhost;
    # Root dossier public (nouvelle structure)
    root /var/www/public;
    index index.php index.html;

    # Static files (frontend) - adjust if you move them
    location /favicon.ico { try_files $uri =404; }
    location /robots.txt  { try_files $uri =404; }

    # API routes
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    # Frontend assets (read-only)
    # IMPORTANT: ^~ pour empêcher que la location regex (png|css|js...) ne capture /frontend/.*
    location ^~ /frontend/ {
        alias /var/www/frontend/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Images and icons
    location ^~ /images-icons/ {
        alias /var/www/images-icons/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ \.(png|jpg|jpeg|gif|svg|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param APPLICATION_ENV dev;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    # Fallback pour toutes autres requêtes (pages dynamiques)
    # Route vers index.php pour le routing applicatif
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-XSS-Protection "1; mode=block";

    # Health check
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
