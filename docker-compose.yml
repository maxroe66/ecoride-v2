services:
  nginx:
    image: nginx:1.29.1
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
  php-fpm:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-dev}
    container_name: php-fpm
    volumes:
      - ./src/backend:/var/www/html/src/backend:delegated
      # Cache Composer (uniquement pour accélérer requêtes si usage direct dans ce conteneur)
      - composer_cache:/tmp/composer
    working_dir: /var/www/html/src/backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  mongo-express:
    image: mongo-express:1.0
    container_name: mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_SERVER: ${ME_CONFIG_MONGODB_SERVER}
    depends_on:
      - mongodb
  composer:
    image: ecoride-v2-php-fpm:latest
    container_name: composer
    working_dir: /var/www/html/src/backend
    entrypoint: ["composer"]
    command: ["--version"]
    volumes:
      - ./src/backend:/var/www/html/src/backend:delegated
      - composer_cache:/tmp/composer
    environment:
      APP_ENV: ${APP_ENV:-dev}
    profiles:
      - tools
volumes:
  db_data:
  mongo_data:
  composer_cache:
