services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - ./app:/var/www/app:ro
      - ./frontend:/var/www/frontend:ro
      - ./images-icons:/var/www/images-icons:ro
      - ./vendor:/var/www/vendor:ro
    networks:
      - backend_net
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        ENABLE_XDEBUG: 1
        TZ: Europe/Paris
    environment:
      APP_ENV: dev
      JWT_SECRET: 7oNSFp7JUVfQ8DJ1m/ZTmL7ryLjHbyOidgtal/bpC+g=
      DB_HOST: db
      DB_USER: ecoride
      DB_PASSWORD: ecoride-v2
      DB_NAME: ecoride
    volumes:
      - ./app:/var/www/app
      - ./public:/var/www/public
      - ./frontend:/var/www/frontend
      - ./storage:/var/www/storage
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
      - ./tests:/var/www/tests:ro
      - ./phpunit.xml.dist:/var/www/phpunit.xml.dist:ro
    networks:
      - backend_net
  db:
    image: mysql:8.4
    # MySQL 8.4: l'option --default-authentication-plugin=mysql_native_password est retirée / non supportée.
    # On conserve utf8mb4 complet. Si besoin de mysql_native_password pour compat héritée, envisager downgrade image 8.0.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride
      MYSQL_PASSWORD: ecoride-v2
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-helocalhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ecoride
      PMA_PASSWORD: ecoride-v2
    ports:
      - "8081:80"
    networks:
      - backend_net
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_net
  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "8082:8081"
    networks:
      - backend_net
volumes:
  mysql_data:
  mongo_data:
networks:
  backend_net:
    driver: bridge
